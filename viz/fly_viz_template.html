<title>Math-Fly Brain</title>
<meta name="description" content="Watch a trained fruit-fly connectome fire neuron-by-neuron, signal flowing along its wires, as it solves an arithmetic problem.">
<style>
  /* Deliberate single-theme "microscope field": glowing neural tissue reads
     only on a dark ground, so we commit to it and paint every color explicitly. */
  :root{
    --bg:#060a12; --bg2:#0b1120; --panel:#0e1626; --panel2:#111c30;
    --line:#1c2a44; --ink:#e8eef9; --muted:#8ba0c2; --faint:#5a6f92;
    --exc:#37e0c6; --inh:#ff5f8d; --accent:#ffce54; --good:#4ce39a; --bad:#ff6b6b;
    --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    --ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1200px 700px at 70% -10%, #10203a 0%, rgba(16,32,58,0) 55%),
      radial-gradient(900px 600px at 0% 110%, #191033 0%, rgba(25,16,51,0) 50%), var(--bg);
    color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .fly{font-size:26px;filter:drop-shadow(0 0 10px rgba(55,224,198,.5));}
  h1{font-size:clamp(20px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;}
  .sub{color:var(--muted);font-size:13px;margin-left:auto;max-width:46ch;text-align:right;}
  .sub b{color:var(--exc);font-weight:600;}

  .poser{display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .eq{display:flex;align-items:center;gap:10px;font-family:var(--mono);}
  .stepper{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .stepper label{font-family:var(--ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .num{width:80px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);
    color:var(--ink);font-family:var(--mono);font-size:26px;font-weight:700;text-align:center;-moz-appearance:textfield;}
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  select.op{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);
    color:var(--accent);font-family:var(--mono);font-size:26px;font-weight:700;padding:0 10px;text-align:center;}
  .eqsign{font-size:28px;color:var(--faint);font-family:var(--mono);}
  .rangehint{font-family:var(--ui);font-size:11px;color:var(--faint);align-self:flex-end;padding-bottom:6px;}
  button.solve{margin-left:auto;height:56px;padding:0 26px;border:0;border-radius:12px;cursor:pointer;
    font-family:var(--ui);font-weight:700;font-size:16px;color:#12203a;
    background:linear-gradient(180deg,#ffe08a,var(--accent));box-shadow:0 6px 18px rgba(255,206,84,.28);}
  button.solve:active{transform:translateY(1px);}
  button.solve:focus-visible,.num:focus-visible,select.op:focus-visible,input:focus-visible{outline:2px solid var(--exc);outline-offset:2px;}

  .stage{display:grid;grid-template-columns:1fr 300px;gap:16px;}
  @media (max-width:820px){.stage{grid-template-columns:1fr;}}
  .brainbox{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0,#0c1524 0,#070c15 70%);min-height:440px;}
  canvas#brain{display:block;width:100%;height:100%;}
  .phase{position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:13px;color:var(--muted);
    background:rgba(6,10,18,.55);border:1px solid var(--line);border-radius:999px;padding:5px 12px;backdrop-filter:blur(4px);}
  .phase b{color:var(--accent);}
  .stream{position:absolute;top:12px;right:14px;display:flex;gap:5px;}
  .tok{width:28px;height:36px;display:grid;place-items:center;border-radius:8px;font-family:var(--mono);
    font-weight:700;font-size:17px;color:var(--faint);background:rgba(12,20,34,.6);border:1px solid var(--line);transition:all .15s ease;}
  .tok.on{color:#0b1220;background:var(--exc);border-color:var(--exc);box-shadow:0 0 16px rgba(55,224,198,.6);transform:translateY(2px);}
  .tok.done{color:var(--muted);}
  .legend{position:absolute;bottom:10px;left:14px;display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--faint);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;}

  .panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:16px;display:flex;flex-direction:column;gap:14px;}
  .answer-card{text-align:center;padding:8px 8px 2px;}
  .answer-card .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
  .answer{font-family:var(--mono);font-weight:700;font-size:60px;line-height:1;color:var(--accent);
    text-shadow:0 0 24px rgba(255,206,84,.35);font-variant-numeric:tabular-nums;transition:opacity .2s;}
  .verdict{font-family:var(--mono);font-size:13px;margin-top:4px;min-height:18px;}
  .verdict.ok{color:var(--good);} .verdict.no{color:var(--bad);}
  .acc{font-size:11px;color:var(--faint);margin-top:6px;}
  .acc b{color:var(--muted);font-weight:600;}
  .cands h3{margin:0 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  /* digit reels (odometer) */
  .reels{display:flex;gap:8px;justify-content:center;}
  .reel{display:flex;flex-direction:column;align-items:center;gap:6px;width:52px;}
  .reel .d{font-family:var(--mono);font-weight:700;font-size:30px;color:var(--ink);width:100%;height:52px;
    display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-variant-numeric:tabular-nums;}
  .reel.lead .d{color:var(--accent);border-color:rgba(255,206,84,.4);box-shadow:0 0 16px rgba(255,206,84,.18);}
  .reel .pl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
  .reel .bar{height:5px;width:100%;border-radius:3px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;}
  .reel .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--exc),var(--accent));transition:width .1s linear;}
  /* compare bars */
  .cmp{display:flex;flex-direction:column;gap:8px;}
  .cbar{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;}
  .cbar .bar{height:14px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;}
  .cbar .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--exc),var(--accent));transition:width .12s linear;}
  .cbar.lead span:first-child{color:var(--accent);}

  .transport{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:14px;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px;}
  .transport button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer;font-size:15px;}
  .transport button:active{transform:translateY(1px);}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--exc);}
  .tclock{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:74px;text-align:right;}
  .speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .toggle input{width:16px;height:16px;accent-color:var(--exc);}
  .foot{margin-top:16px;color:var(--faint);font-size:12px;line-height:1.6;}
  .foot b{color:var(--muted);font-weight:600;}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-right:6px;}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="fly">🪰</span><div><h1>Math-Fly Brain</h1></div></div>
    <div class="sub">A <b>connectome-constrained</b> network — the fruit fly's real wiring — solving arithmetic live. Every dot is a neuron; sparks are signal moving along its synapses.</div>
  </header>

  <div class="poser">
    <div class="eq">
      <div class="stepper"><label>a</label><input class="num" id="a" type="number" min="0" max="99" value="8"></div>
      <div class="stepper"><label>op</label>
        <select class="op" id="op">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value=">">&gt;</option>
        </select>
      </div>
      <div class="stepper"><label>b</label><input class="num" id="b" type="number" min="0" max="99" value="7"></div>
      <span class="eqsign">=</span>
    </div>
    <span class="rangehint" id="rangehint"></span>
    <button class="solve" id="solve">Ask the fly ▸</button>
  </div>

  <div class="stage">
    <div class="brainbox">
      <canvas id="brain"></canvas>
      <div class="phase" id="phase">idle</div>
      <div class="stream" id="stream"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--exc)"></i>excitatory</span>
        <span><i class="dot" style="background:var(--inh)"></i>inhibitory</span>
        <span><i class="dot" style="background:var(--accent)"></i>sensory in</span>
        <span>✦ signal on synapse</span>
      </div>
    </div>

    <aside class="panel">
      <div class="answer-card">
        <div class="lbl">the fly answers</div>
        <div class="answer" id="answer">–</div>
        <div class="verdict" id="verdict"></div>
        <div class="acc" id="acc"></div>
      </div>
      <div class="cands">
        <h3 id="candTitle">Readout — answer forming</h3>
        <div id="cands"></div>
      </div>
    </aside>
  </div>

  <div class="transport">
    <button id="play" title="play / pause">▶</button>
    <button id="restart" title="restart">⟲</button>
    <input type="range" id="scrub" min="0" max="1" value="0" step="1">
    <span class="tclock" id="clock">t 0 / 0</span>
    <span class="speed"><label for="speed">speed</label><input type="range" id="speed" min="1" max="12" value="5" step="1" style="width:76px"></span>
    <label class="toggle"><input type="checkbox" id="trails" checked>signal trails</label>
  </div>

  <div class="foot" id="foot"></div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script>
"use strict";
const BUNDLE = /*__BUNDLE__*/null;
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------------------------------------- bundle -> constants
const M = BUNDLE.meta;
const N = M.N, ALPHA = M.alpha, SPT = M.steps_per_token, SETTLE = M.settle_tokens, GAIN = M.input_gain;
const EMBED = BUNDLE.embed, T2I = BUNDLE.token2id;
const IN = BUNDLE.input_neurons, RD = BUNDLE.readout_neurons, SIGN = BUNDLE.sign, POS = BUNDLE.pos;
const E_PRE = BUNDLE.edges.pre, E_POST = BUNDLE.edges.post, E_W = BUNDLE.edges.w, NE = E_W.length;
const TASKS = BUNDLE.tasks;                     // keyed by op symbol

// ---------------------------------------------- reservoir forward (mirrors Python)
function tokenize(op, a, b){
  const tok=[]; for(const c of String(a)) tok.push(c);
  tok.push(op===">" ? "-" : op);               // compare trained on "a - b ="
  for(const c of String(b)) tok.push(c); tok.push("="); return tok;
}
function buildInput(tokens){
  const T=(tokens.length+SETTLE)*SPT, U=[], drive=[];
  for(const tok of tokens){ const vec=EMBED[T2I[tok]]; for(let s=0;s<SPT;s++){U.push(vec);drive.push(tok);} }
  const go=EMBED[T2I["<GO>"]]; for(let s=0;s<SETTLE*SPT;s++){U.push(go);drive.push("=think");}
  return {U,drive,T};
}
function run(tokens){
  const {U,drive,T}=buildInput(tokens); const winStart=T-SETTLE*SPT;
  let x=new Float32Array(N); const R=[];
  for(let t=0;t<T;t++){
    const rPrev=new Float32Array(N); for(let i=0;i<N;i++) rPrev[i]=Math.tanh(x[i]);
    const rec=new Float32Array(N); for(let k=0;k<NE;k++) rec[E_POST[k]]+=E_W[k]*rPrev[E_PRE[k]];
    const uvec=U[t]; const xn=new Float32Array(N);
    for(let i=0;i<N;i++) xn[i]=(1-ALPHA)*x[i]+ALPHA*rec[i];
    for(let j=0;j<IN.length;j++) xn[IN[j]]+=ALPHA*(uvec[j]*GAIN);
    const rt=new Float32Array(N); for(let i=0;i<N;i++) rt[i]=Math.tanh(xn[i]);
    R.push(rt); x=xn;
  }
  return {R,drive,T,winStart};
}
function featOf(R,winStart,upTo){
  const F=RD.length, mean=new Float32Array(F+1), cnt=Math.max(1,upTo-winStart);
  for(let t=winStart;t<upTo;t++){const rt=R[t];for(let j=0;j<F;j++) mean[j]+=rt[RD[j]];}
  for(let j=0;j<F;j++) mean[j]/=cnt; mean[F]=1.0; return mean;
}
function matvec(W,feat){ const A=W.length,out=new Float32Array(A);
  for(let a=0;a<A;a++){let s=0;const w=W[a];for(let j=0;j<feat.length;j++)s+=w[j]*feat[j];out[a]=s;} return out; }
function softmax(v){ let m=-1e9; for(const x of v) if(x>m)m=x; let s=0; const e=v.map(x=>{const y=Math.exp(x-m);s+=y;return y;}); return e.map(y=>y/s); }
function argmax(v){ let bi=0,bv=-1e9; for(let i=0;i<v.length;i++) if(v[i]>bv){bv=v[i];bi=i;} return bi; }

// decode readout for a task at a given upTo frame -> {answer, digits?, probs?}
function decode(R, winStart, upTo, task){
  const feat=featOf(R,winStart,upTo);
  if(task.mode==="digits"){
    const D=task.display_digits, digits=[], conf=[];
    for(let d=0;d<D;d++){ const p=softmax(matvec(task.digit_heads[d],feat)); const dv=argmax(p); digits.push(dv); conf.push(p[dv]); }
    let answer=0; for(let d=0;d<D;d++) answer+=digits[d]*Math.pow(10,d);
    return {answer,digits,conf};                // digits: position 0 = units
  } else {
    const p=softmax(matvec(task.W_out,feat)); return {answer:argmax(p),probs:p};
  }
}

// ---------------------------------------------- canvas
const cv=$("brain"), ctx=cv.getContext("2d");
let CW=0,CH=0,PTS=[],edgeCanvas=null,SPARK_EDGES=[];
function layout(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.parentElement.getBoundingClientRect();
  CW=r.width; CH=Math.max(440,r.height);
  cv.width=CW*dpr; cv.height=CH*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const padX=26,padY=34;
  PTS=POS.map(p=>[padX+p[0]*(CW-2*padX),padY+p[1]*(CH-2*padY)]);
  drawEdges();
  // candidate edges for sparks: strongest synapses (most visible signal)
  SPARK_EDGES=[...Array(NE).keys()].sort((p,q)=>Math.abs(E_W[q])-Math.abs(E_W[p])).slice(0,3000);
}
function drawEdges(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  edgeCanvas=document.createElement("canvas"); edgeCanvas.width=CW*dpr; edgeCanvas.height=CH*dpr;
  const ec=edgeCanvas.getContext("2d"); ec.setTransform(dpr,0,0,dpr,0,0); ec.lineWidth=0.6;
  const stride=Math.max(1,Math.floor(NE/6000));
  for(let k=0;k<NE;k+=stride){ const A=PTS[E_PRE[k]],B=PTS[E_POST[k]];
    ec.strokeStyle=E_W[k]<0?"rgba(255,95,141,0.05)":"rgba(55,224,198,0.05)";
    ec.beginPath();ec.moveTo(A[0],A[1]);ec.lineTo(B[0],B[1]);ec.stroke(); }
}
function computeActiveEdges(frame){
  const R=STATE.R; if(!R) return [];
  const src=R[Math.max(0,frame)];
  const scored=[];
  for(const k of SPARK_EDGES){ const st=Math.abs(src[E_PRE[k]])*Math.min(4,Math.abs(E_W[k]));
    if(st>0.35) scored.push([k,st]); }
  scored.sort((p,q)=>q[1]-p[1]);
  return scored.slice(0,200).map(([k,st])=>({pre:E_PRE[k],post:E_POST[k],inh:E_W[k]<0,st}));
}
function render(phase){
  ctx.clearRect(0,0,CW,CH);
  if(edgeCanvas){const dpr=Math.min(2,window.devicePixelRatio||1);ctx.drawImage(edgeCanvas,0,0,edgeCanvas.width/dpr,edgeCanvas.height/dpr);}
  const R=STATE.R;
  // signal sparks travelling along wires
  if($("trails").checked && STATE.activeEdges){
    ctx.globalCompositeOperation="lighter";
    for(const e of STATE.activeEdges){
      const A=PTS[e.pre],B=PTS[e.post];
      const col=e.inh?"255,95,141":"55,224,198";
      const frac=REDUCED?0.5:((phase*(0.6+e.st*0.25)+(e.pre%7)/7)%1);
      const x=A[0]+(B[0]-A[0])*frac, y=A[1]+(B[1]-A[1])*frac;
      const a=clamp(0.12+e.st*0.5,0,0.9);
      ctx.strokeStyle=`rgba(${col},${a*0.25})`; ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
      ctx.fillStyle=`rgba(${col},${a})`; ctx.shadowBlur=8; ctx.shadowColor=`rgba(${col},${a})`;
      ctx.beginPath();ctx.arc(x,y,1.5+e.st*1.4,0,6.2832);ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  // neurons
  ctx.globalCompositeOperation="lighter";
  for(let i=0;i<N;i++){
    const act=R?Math.abs(R[STATE.frame][i]):0;
    const base=SIGN[i]>=0?[55,224,198]:[255,95,141];
    const p=PTS[i], rad=1.3+act*3.6, alpha=0.10+act*0.85;
    if(act>0.12){ctx.shadowBlur=6+act*16;ctx.shadowColor=`rgba(${base[0]},${base[1]},${base[2]},${alpha})`;}else ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(${base[0]},${base[1]},${base[2]},${alpha})`;
    ctx.beginPath();ctx.arc(p[0],p[1],rad,0,6.2832);ctx.fill();
  }
  ctx.shadowBlur=0; ctx.globalCompositeOperation="source-over";
  ctx.strokeStyle="rgba(255,206,84,0.25)";ctx.lineWidth=1;
  for(const i of IN){const p=PTS[i];ctx.beginPath();ctx.arc(p[0],p[1],2.4,0,6.2832);ctx.stroke();}
}

// ---------------------------------------------- state + playback
const STATE={R:null,drive:null,T:0,winStart:0,tokens:[],op:"+",task:null,frame:0,playing:false,activeEdges:[],answer:null,truth:null,correct:null};
let raf=null,acc=0,phase=0;

function rangeFor(op){ const t=TASKS[op]; return [t.operand_lo,t.operand_hi]; }
function syncRange(){ const op=$("op").value,[lo,hi]=rangeFor(op);
  for(const id of ["a","b"]){const el=$(id);el.min=lo;el.max=hi;el.value=clamp(parseInt(el.value||"0"),lo,hi);}
  $("rangehint").textContent=`0–${hi}`; }

function poseProblem(){
  const op=$("op").value, task=TASKS[op], [lo,hi]=rangeFor(op);
  let a=clamp(parseInt($("a").value||"0"),lo,hi), b=clamp(parseInt($("b").value||"0"),lo,hi);
  if(op==="-"&&b>a){[a,b]=[b,a];}
  $("a").value=a; $("b").value=b;
  const tokens=tokenize(op,a,b);
  const {R,drive,T,winStart}=run(tokens);
  const {answer}=decode(R,winStart,T,task);
  let truth; if(op==="+")truth=a+b; else if(op==="-")truth=a-b; else if(op==="*")truth=a*b; else truth=(a>b)?1:0;
  Object.assign(STATE,{R,drive,T,winStart,tokens,op,task,frame:0,answer,truth,correct:(answer===truth),a,b});
  const opName={"+":"addition","-":"subtraction","*":"multiplication",">":"comparison"}[op];
  $("acc").innerHTML = (task.accuracy!=null)
    ? `on held-out ${opName} in this range, this fly is right <b>${Math.round(task.accuracy*100)}%</b> of the time`
    : "";
  buildStream(tokens,op); buildReadoutSkeleton(task);
  $("scrub").max=T-1; $("scrub").value=0;
  STATE.activeEdges=computeActiveEdges(0);
  play();
}
function buildStream(tokens,op){
  const s=$("stream"); s.innerHTML="";
  const disp=tokens.slice(); if(op===">"){const oi=disp.indexOf("-");if(oi>=0)disp[oi]=">";}
  disp.forEach((t,i)=>{const d=document.createElement("div");d.className="tok";d.dataset.i=i;d.textContent=t;s.appendChild(d);});
}
function buildReadoutSkeleton(task){
  const c=$("cands");
  if(task.mode==="digits"){
    $("candTitle").textContent="Readout — digits forming (units → tens)";
    c.className=""; c.innerHTML="";
    const reels=document.createElement("div"); reels.className="reels";
    const PL=["units","tens","hund.","thou."];
    for(let d=task.display_digits-1; d>=0; d--){                 // most-significant left
      const r=document.createElement("div"); r.className="reel"; r.dataset.d=d;
      r.innerHTML=`<div class="d">–</div><div class="bar"><i></i></div><div class="pl">${PL[d]||("10^"+d)}</div>`;
      reels.appendChild(r);
    }
    c.appendChild(reels);
  } else {
    $("candTitle").textContent="Readout — decision forming";
    c.className="cmp"; c.innerHTML=`
      <div class="cbar" data-v="1"><span>TRUE</span><div class="bar"><i></i></div></div>
      <div class="cbar" data-v="0"><span>FALSE</span><div class="bar"><i></i></div></div>`;
  }
}
function phaseLabel(frame){
  const d=STATE.drive[frame];
  if(d==="=think")return 'thinking <b>· · ·</b>';
  if(d==="=")return 'reading <b>=</b>';
  return 'reading <b>'+(d==='-'&&STATE.op==='>'?'>':d)+'</b>';
}
function labelFor(v){ return (STATE.task&&STATE.task.compare)?(v===1?"TRUE":"FALSE"):String(v); }

function updatePanels(frame){
  $("phase").innerHTML=phaseLabel(frame);
  $("clock").textContent=`t ${frame+1} / ${STATE.T}`;
  $("scrub").value=frame;
  const tokEls=$("stream").children, tokIdx=Math.floor(frame/SPT);
  for(let i=0;i<tokEls.length;i++){tokEls[i].classList.toggle("on",i===tokIdx&&frame<STATE.tokens.length*SPT);tokEls[i].classList.toggle("done",i<tokIdx);}
  const inSettle=frame>=STATE.winStart;
  if(!inSettle){
    $("answer").textContent="–"; $("answer").style.opacity=".5";
    $("verdict").textContent=""; $("verdict").className="verdict";
    // dim reels/bars
    $("cands").querySelectorAll(".d,.bar>i").forEach(()=>{});
    return;
  }
  const dec=decode(STATE.R,STATE.winStart,frame+1,STATE.task);
  $("answer").textContent=labelFor(dec.answer); $("answer").style.opacity="1";
  if(STATE.task.mode==="digits"){
    const reels=$("cands").querySelectorAll(".reel");
    reels.forEach(r=>{const d=+r.dataset.d;const dv=dec.digits[d];const conf=dec.conf[d];
      r.querySelector(".d").textContent=dv; r.querySelector("i").style.width=(6+conf*94).toFixed(0)+"%";
      r.classList.toggle("lead",d>=1?dv>0:true);});
  } else {
    const bars=$("cands").querySelectorAll(".cbar");
    bars.forEach(bar=>{const v=+bar.dataset.v;const p=dec.probs[v]||0;
      bar.querySelector("i").style.width=(6+p*94).toFixed(0)+"%"; bar.classList.toggle("lead",v===dec.answer);});
  }
  if(frame===STATE.T-1){
    $("answer").textContent=labelFor(STATE.answer);
    const v=$("verdict");
    if(STATE.correct){v.textContent="✓ correct";v.className="verdict ok";}
    else{v.textContent="✗ it guessed (true: "+labelFor(STATE.truth)+")";v.className="verdict no";}
  }
}

function advanceFrame(){
  STATE.frame++;
  if(STATE.frame>=STATE.T){STATE.frame=STATE.T-1;STATE.playing=false;$("play").textContent="▶";}
  STATE.activeEdges=computeActiveEdges(STATE.frame);
  updatePanels(STATE.frame);
}
function loop(){
  const spd=parseInt($("speed").value);
  if(STATE.playing){ acc++; phase+=0.03+spd*0.006;
    if(acc>=(13-spd)){acc=0;advanceFrame();} }
  render(phase);
  raf=requestAnimationFrame(loop);
}
function play(){ STATE.playing=true; $("play").textContent="❚❚"; if(!raf) raf=requestAnimationFrame(loop); }
function pause(){ STATE.playing=false; $("play").textContent="▶"; }

$("solve").onclick=poseProblem;
$("op").onchange=()=>{syncRange();poseProblem();};
$("play").onclick=()=>{ if(STATE.playing)pause(); else{ if(STATE.frame>=STATE.T-1)STATE.frame=0; play(); } };
$("restart").onclick=()=>{ STATE.frame=0; STATE.activeEdges=computeActiveEdges(0); updatePanels(0); play(); };
$("scrub").oninput=e=>{ pause(); STATE.frame=clamp(+e.target.value,0,STATE.T-1); STATE.activeEdges=computeActiveEdges(STATE.frame); updatePanels(STATE.frame); render(phase); };
["a","b"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")poseProblem();}));
window.addEventListener("resize",()=>{layout();render(phase);});

$("foot").innerHTML=
  `<span class="pill">${M.source} connectome</span>`+
  `<span class="pill">${N.toLocaleString()} neurons</span>`+
  `<span class="pill">${M.n_synapses.toLocaleString()} synapses</span>`+
  `<span class="pill">digit-serial readout</span><br>`+
  `<b>How to read it:</b> each digit and the operator arrive as timed pulses on the gold sensory neurons (top-right). `+
  `Signal spreads through the fixed fly wiring — teal excitatory, rose inhibitory, sparks are transmission along synapses — `+
  `and during the “thinking” window the readout neurons are decoded one decimal place at a time into the answer. `+
  `The wiring is frozen anatomy; only the readout was trained, so the little brain sometimes guesses wrong — that’s real.`;

// boot alive
if(!raf) raf=requestAnimationFrame(loop);
syncRange(); layout(); poseProblem();
</script>
