<title>Scientific Calculator Fly</title>
<meta name="description" content="The real Janelia male-CNS fruit-fly connectome, shown in its true anatomy, evaluating whole expressions one step at a time — and still able to move.">
<style>
  :root{--bg:#060a12;--bg2:#0b1120;--panel:#0e1626;--panel2:#111c30;--line:#1c2a44;
    --ink:#e8eef9;--muted:#8ba0c2;--faint:#5a6f92;--exc:#37e0c6;--inh:#ff5f8d;--accent:#ffce54;
    --good:#4ce39a;--bad:#ff6b6b;--motor:#8ab4ff;--key:#16233b;--fn:#1a2a1f;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--ui:"Sora",system-ui,sans-serif;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#10203a 0,rgba(16,32,58,0) 55%),radial-gradient(900px 600px at 0% 110%,#191033 0,rgba(25,16,51,0) 50%),var(--bg);
    color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:10px;}.brand .fly{font-size:26px;filter:drop-shadow(0 0 10px rgba(55,224,198,.5));}
  h1{font-size:clamp(20px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;}
  .sub{color:var(--muted);font-size:13px;margin-left:auto;max-width:46ch;text-align:right;}.sub b{color:var(--exc);font-weight:600;}
  .real{display:inline-block;font-family:var(--mono);font-size:11px;color:#0b1220;background:var(--exc);border-radius:999px;padding:2px 9px;margin-bottom:12px;font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 330px;gap:16px;}@media(max-width:860px){.stage{grid-template-columns:1fr;}}
  .brainbox{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,#0c1524 0,#070c15 72%);min-height:560px;}
  canvas#brain{display:block;width:100%;height:100%;}
  .status{position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none;}
  .status .step{display:inline-block;font-family:var(--mono);font-size:15px;color:var(--ink);background:rgba(6,10,18,.7);border:1px solid var(--line);border-radius:999px;padding:6px 16px;backdrop-filter:blur(4px);}
  .status .step b{color:var(--accent);}
  .legend{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--faint);}
  .legend span{display:flex;align-items:center;gap:6px;}.dot{width:9px;height:9px;border-radius:50%;}
  .calc{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px;display:flex;flex-direction:column;gap:10px;}
  .disp{background:#070d18;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
  .expr{font-family:var(--mono);font-size:16px;color:var(--ink);min-height:22px;overflow-x:auto;white-space:nowrap;}
  .ans{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 18px rgba(255,206,84,.3);}
  .accline{font-size:10px;color:var(--faint);text-align:right;min-height:14px;}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .fns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  button.k{height:44px;border:1px solid var(--line);border-radius:11px;background:var(--key);color:var(--ink);font-family:var(--mono);font-size:17px;cursor:pointer;user-select:none;}
  button.k:hover{border-color:var(--faint);}button.k:active{transform:translateY(1px);}button.k.op{color:var(--accent);}
  button.k.fn{background:var(--fn);color:var(--good);font-size:14px;font-family:var(--ui);font-weight:600;}
  button.k.eq{background:linear-gradient(180deg,#ffe08a,var(--accent));color:#12203a;font-weight:700;}
  button.k.clr{color:var(--bad);}
  button:focus-visible{outline:2px solid var(--exc);outline-offset:2px;}
  .move{border-top:1px solid var(--line);padding-top:10px;}
  .move h3{margin:0 0 7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .movegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .movebtn{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--motor);cursor:pointer;font-size:15px;}
  .movebtn.on{background:var(--motor);color:#0b1220;box-shadow:0 0 14px rgba(138,180,255,.5);}
  .movestat{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;min-height:16px;}.movestat b{color:var(--motor);}
  .foot{margin-top:16px;color:var(--faint);font-size:12px;line-height:1.6;}.foot b{color:var(--muted);}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-right:6px;}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="fly">🪰</span><div><h1>Scientific Calculator Fly</h1></div></div>
    <div class="sub">The <b>real male-CNS connectome</b>, drawn in its true anatomy, evaluating whole expressions one elementary step at a time.</div>
  </header>
  <span class="real" id="realtag">real fly</span>

  <div class="stage">
    <div class="brainbox">
      <canvas id="brain"></canvas>
      <div class="status"><span class="step" id="step">ready</span></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--exc)"></i>excitatory</span>
        <span><i class="dot" style="background:var(--inh)"></i>inhibitory</span>
        <span><i class="dot" style="background:var(--accent)"></i>number input</span>
        <span><i class="dot" style="background:var(--motor)"></i>motor neuron</span>
      </div>
    </div>

    <aside class="calc">
      <div class="disp">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="ans" id="ans">0</div>
      </div>
      <div class="accline" id="acc">&nbsp;</div>
      <div class="fns">
        <button class="k fn" data-fn="square">x²</button>
        <button class="k fn" data-fn="sqrt">√</button>
        <button class="k fn" data-fn="sin">sin</button>
        <button class="k fn" data-fn="cos">cos</button>
        <button class="k fn" data-fn="log">log</button>
        <button class="k fn" data-fn="inv">1/x</button>
        <button class="k op" data-tok="(">(</button>
        <button class="k op" data-tok=")">)</button>
      </div>
      <div class="keys">
        <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button><button class="k op" data-tok="÷">÷</button>
        <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button><button class="k op" data-tok="×">×</button>
        <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button><button class="k op" data-tok="−">−</button>
        <button class="k clr" id="clr">C</button><button class="k" data-d="0">0</button><button class="k eq" id="eq">=</button><button class="k op" data-tok="+">+</button>
      </div>
      <div class="move">
        <h3>Basic movement (real motor neurons)</h3>
        <div class="movegrid">
          <button class="movebtn" data-c="1">◀</button><button class="movebtn" data-c="0">▲</button>
          <button class="movebtn" data-c="3">■</button><button class="movebtn" data-c="2">▶</button>
        </div>
        <div class="movestat" id="movestat"></div>
      </div>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script>
"use strict";
const B=/*__BUNDLE__*/null;
const $=id=>document.getElementById(id);
const M=B.meta,N=M.N,ALPHA=M.alpha,GAIN=M.gain,STEPS=M.steps,RWIN=M.read_win;
const SIGN=B.sign,POS=B.pos,SLOTS=B.slot_sets,CMDS=B.cmd_sets,READ=B.read,MOTOR=B.motor,OPS=B.ops,TR=B.trunk;
const E_PRE=B.edges.pre,E_POST=B.edges.post,E_W=B.edges.w,NE=E_W.length;
const SYM2NAME={"+":"add","−":"sub","-":"sub","×":"mul","*":"mul","÷":"div","/":"div"};

// ---------- fly forward (mirrors mathfly.sci_fly) ----------
function digs(x){x=Math.max(0,Math.round(x));return [Math.floor(x/100)%10,Math.floor(x/10)%10,x%10];}
function dyn(u){let x=new Float32Array(N);const R=[];
  for(let t=0;t<STEPS;t++){const r=new Float32Array(N);for(let i=0;i<N;i++)r[i]=Math.tanh(x[i]);
    const rec=new Float32Array(N);for(let k=0;k<NE;k++)rec[E_POST[k]]+=E_W[k]*r[E_PRE[k]];
    const xn=new Float32Array(N);for(let i=0;i<N;i++)xn[i]=(1-ALPHA)*x[i]+ALPHA*(rec[i]+u[i]);
    const rt=new Float32Array(N);for(let i=0;i<N;i++)rt[i]=Math.tanh(xn[i]);R.push(rt);x=xn;}return R;}
function binSets(a,b){const s=[];digs(a).forEach((d,i)=>s.push(SLOTS[i][d]));digs(b).forEach((d,i)=>s.push(SLOTS[3+i][d]));return s;}
function unSets(a){const s=[];digs(a).forEach((d,i)=>s.push(SLOTS[i][d]));return s;}
function drive(sets){const u=new Float32Array(N);for(const set of sets)for(const n of set)u[n]+=GAIN;return u;}
function feat(R,neurons,upTo){const F=neurons.length,m=new Float32Array(F+1),lo=STEPS-RWIN,hi=Math.min(upTo+1,STEPS),cnt=Math.max(1,hi-lo);
  for(let t=lo;t<hi;t++){const rt=R[t];for(let j=0;j<F;j++)m[j]+=rt[neurons[j]];}for(let j=0;j<F;j++)m[j]/=cnt;m[F]=1;return m;}
function mvec(Wr,x){const o=new Float32Array(Wr.length);for(let i=0;i<Wr.length;i++){let s=0;const w=Wr[i];for(let j=0;j<x.length;j++)s+=w[j]*x[j];o[i]=s;}return o;}
function addb(v,b){const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]+b[i];return o;}
function relu(v){const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]>0?v[i]:0;return o;}
function trunk(f){return relu(addb(mvec(TR.W2,relu(addb(mvec(TR.W1,f),TR.b1))),TR.b2));}
function mlp(m,f){const h1=relu(addb(mvec(m.W1,f),m.b1)),h2=relu(addb(mvec(m.W2,h1),m.b2));return addb(mvec(m.W3,h2),m.b3);}
function argseg(o,off){let bi=0,bv=-1e9;for(let i=0;i<10;i++)if(o[off+i]>bv){bv=o[off+i];bi=i;}return bi;}
function decodeVal(op,R){const f=feat(R,READ,STEPS-1);const o=op.kind==="trunk"?addb(mvec(op.W,trunk(f)),op.hb):mlp(op.mlp,f);
  let mag=0;for(let d=0;d<op.K;d++)mag+=argseg(o,d*10)*Math.pow(10,d);
  let sign=op.signed&&o[op.K*10+1]>o[op.K*10]?-1:1;return sign*mag/Math.pow(10,op.dec);}
function clampToOp(op,v){return Math.min(op.a[1],Math.max(op.a[0],Math.round(v)));}
function fmt(op,v){return op&&op.dec>0?(+v).toFixed(op.dec):String(Math.round(v));}

// ---------- anatomical canvas (letterboxed, aspect preserved) ----------
const cv=$("brain"),ctx=cv.getContext("2d");let CW,CH,PTS=[],edgeCanvas=null,BOX=null;
function layout(){const dpr=Math.min(2,devicePixelRatio||1),r=cv.parentElement.getBoundingClientRect();
  CW=r.width;CH=Math.max(560,r.height);cv.width=CW*dpr;cv.height=CH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of POS){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
  const pad=30,s=Math.min((CW-2*pad)/(x1-x0),(CH-2*pad)/(y1-y0)),ox=(CW-(x1-x0)*s)/2,oy=(CH-(y1-y0)*s)/2;
  PTS=POS.map(p=>[ox+(p[0]-x0)*s,oy+(p[1]-y0)*s]);
  BOX={x0:ox,y0:oy,x1:ox+(x1-x0)*s,y1:oy+(y1-y0)*s};drawEdges();}
function drawEdges(){const dpr=Math.min(2,devicePixelRatio||1);edgeCanvas=document.createElement("canvas");
  edgeCanvas.width=CW*dpr;edgeCanvas.height=CH*dpr;const ec=edgeCanvas.getContext("2d");ec.setTransform(dpr,0,0,dpr,0,0);ec.lineWidth=0.5;
  const st=Math.max(1,Math.floor(NE/7000));for(let k=0;k<NE;k+=st){const A=PTS[E_PRE[k]],Bp=PTS[E_POST[k]];
    ec.strokeStyle=E_W[k]<0?"rgba(255,95,141,0.05)":"rgba(55,224,198,0.05)";ec.beginPath();ec.moveTo(A[0],A[1]);ec.lineTo(Bp[0],Bp[1]);ec.stroke();}
  // faint region labels
  ec.fillStyle="rgba(139,160,194,0.28)";ec.font="11px 'JetBrains Mono',monospace";ec.textAlign="center";
  ec.fillText("B R A I N",(BOX.x0+BOX.x1)/2,BOX.y0+14);
  ec.fillText("N E R V E   C O R D",(BOX.x0+BOX.x1)/2,BOX.y1-6);}
function render(frame){ctx.clearRect(0,0,CW,CH);
  if(edgeCanvas){const dpr=Math.min(2,devicePixelRatio||1);ctx.drawImage(edgeCanvas,0,0,edgeCanvas.width/dpr,edgeCanvas.height/dpr);}
  const R=A.R;ctx.globalCompositeOperation="lighter";
  for(let i=0;i<N;i++){const act=R?Math.abs(R[frame][i]):0,base=SIGN[i]>=0?[55,224,198]:[255,95,141],p=PTS[i],rad=1.1+act*4.0,al=0.08+act*0.9;
    if(act>0.10){ctx.shadowBlur=6+act*18;ctx.shadowColor=`rgba(${base[0]},${base[1]},${base[2]},${al})`;}else ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(${base[0]},${base[1]},${base[2]},${al})`;ctx.beginPath();ctx.arc(p[0],p[1],rad,0,6.2832);ctx.fill();}
  ctx.shadowBlur=0;ctx.globalCompositeOperation="source-over";
  if(A.inputSets){ctx.strokeStyle="rgba(255,206,84,.7)";ctx.lineWidth=1.6;for(const set of A.inputSets)for(const n of set){const p=PTS[n];ctx.beginPath();ctx.arc(p[0],p[1],3.4,0,6.2832);ctx.stroke();}}
  ctx.strokeStyle="rgba(138,180,255,.32)";ctx.lineWidth=1;for(const i of MOTOR){const p=PTS[i];ctx.beginPath();ctx.arc(p[0],p[1],2,0,6.2832);ctx.stroke();}}

// ---------- animation driver (robust, sequential) ----------
const A={R:null,frame:0,inputSets:null,onDone:null};
let running=false,tc=0,_lastR=null;const SPEED=3;
function runAnim(R,inputSets,label,onDone){A.R=R;A.frame=0;A.inputSets=inputSets;A.onDone=onDone;_lastR=R;
  $("step").innerHTML=label;if(!running){running=true;requestAnimationFrame(tick);}}
function tick(){
  if(!A.R){running=false;return;}
  render(Math.min(A.frame,STEPS-1));
  if(A.frame>=STEPS-1){                 // this step's animation is done
    const cb=A.onDone;A.onDone=null;A.R=null;
    if(cb)cb();                         // may start the next step via runAnim
    if(A.R){requestAnimationFrame(tick);}else running=false;
    return;
  }
  tc++;if(tc>=SPEED){tc=0;A.frame++;}
  requestAnimationFrame(tick);
}
function lastR(){return _lastR;}

// ---------- expression parsing (shunting-yard, precedence) ----------
function tokenize(str){str=str.replace(/[−]/g,"-").replace(/[×]/g,"*").replace(/[÷]/g,"/");const t=[];let i=0;
  while(i<str.length){const c=str[i];
    if(c>="0"&&c<="9"){let n="";while(i<str.length&&str[i]>="0"&&str[i]<="9")n+=str[i++];t.push({t:"num",v:+n});}
    else if("+-*/".includes(c)){t.push({t:"op",v:c});i++;}
    else if(c==="("||c===")"){t.push({t:c});i++;}else i++;}return t;}
const PREC={"+":1,"-":1,"*":2,"/":2};
function toRPN(tok){const out=[],ops=[];for(const k of tok){
  if(k.t==="num")out.push(k);
  else if(k.t==="op"){while(ops.length&&ops[ops.length-1].t==="op"&&PREC[ops[ops.length-1].v]>=PREC[k.v])out.push(ops.pop());ops.push(k);}
  else if(k.t==="(")ops.push(k);
  else if(k.t===")"){while(ops.length&&ops[ops.length-1].t!=="(")out.push(ops.pop());ops.pop();}}
  while(ops.length)out.push(ops.pop());return out;}

// ---------- evaluate an expression by driving the fly per step ----------
let curExpr="",busy=false;
function setDisp(expr,ans,acc){$("expr").textContent=expr||" ";if(ans!==undefined)$("ans").textContent=ans;$("acc").innerHTML=acc||"&nbsp;";}
function accLine(name,maxOperand){const op=OPS[name];const nm={add:"addition",sub:"subtraction",mul:"multiplication",div:"division",square:"squares",sqrt:"√",sin:"sine",cos:"cosine",log:"log₁₀",inv:"1/x"}[name];
  let s=`fly scores <b>${Math.round(op.accuracy*100)}%</b> on ${nm} (${op.a[0]}–${op.a[1]})`;
  if(maxOperand!=null&&maxOperand>op.a[1])s+=` — ${maxOperand} exceeds its range`;return s;}

function clampB(op,b){return Math.min(op.b[1],Math.max(op.b[0],Math.round(b)));}
function evalExpr(onDone){
  const rpn=toRPN(tokenize(curExpr));const st=[];let ip=0;
  function next(){
    if(ip>=rpn.length){onDone(st.length?st[st.length-1]:0);return;}
    const k=rpn[ip++];
    if(k.t==="num"){st.push(k.v);next();return;}
    const name=SYM2NAME[k.v],op=OPS[name];const b=st.pop(),a=st.pop();
    const A2=clampToOp(op,a),B2=clampB(op,b),sets=binSets(A2,B2);
    setDisp(curExpr,"…",accLine(name,Math.max(a,b)));
    runAnim(dyn(drive(sets)),sets,`brain computing <b>${A2} ${op.sym} ${B2}</b>`,()=>{
      const v=decodeVal(op,lastR());st.push(v);$("step").innerHTML=`${A2} ${op.sym} ${B2} = <b>${fmt(op,v)}</b>`;
      setDisp(curExpr,fmt(op,v),accLine(name));next();});
  }
  next();
}
function evaluate(){if(busy)return;if(!curExpr.trim())return;busy=true;
  document.querySelectorAll(".movebtn").forEach(x=>x.classList.remove("on"));$("movestat").textContent="";
  evalExpr(v=>{busy=false;const shown=Number.isInteger(v)?v:(+v).toFixed(3);curExpr=String(Math.round(v));
    $("ans").textContent=shown;$("step").innerHTML=`answer <b>${shown}</b>`;});}
function applyFn(name){if(busy)return;const op=OPS[name];if(!curExpr.trim())return;busy=true;
  evalExpr(v=>{const a=clampToOp(op,v),sets=unSets(a);setDisp(`${op.sym}(${Math.round(v)})`,"…",accLine(name,v));
    runAnim(dyn(drive(sets)),sets,`brain computing <b>${op.sym}(${a})</b>`,()=>{const r=decodeVal(op,lastR());busy=false;
      curExpr=fmt(op,r);setDisp(`${op.sym}(${Math.round(v)})`,fmt(op,r),accLine(name));$("step").innerHTML=`answer <b>${fmt(op,r)}</b>`;});});}
function doMove(c){if(busy)return;busy=true;document.querySelectorAll(".movebtn").forEach(x=>x.classList.toggle("on",+x.dataset.c===c));
  runAnim(dyn(drive([CMDS[c]])),null,'nerve cord: <b>motor neurons firing</b>',()=>{const f=feat(lastR(),MOTOR,STEPS-1);
    let bi=0,bv=-1e9;const o=mvec(B.movement.W_move,f);for(let i=0;i<o.length;i++)if(o[i]>bv){bv=o[i];bi=i;}
    busy=false;$("movestat").innerHTML=`motor output → <b>${B.movement.commands[bi]}</b> ✓`;$("step").innerHTML=`moved <b>${B.movement.commands[bi]}</b>`;});}
function press(s){if(busy)return;curExpr+=s;setDisp(curExpr);}

document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.d)));
document.querySelectorAll("[data-tok]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.tok)));
document.querySelectorAll("[data-fn]").forEach(b=>b.addEventListener("click",()=>applyFn(b.dataset.fn)));
document.querySelectorAll(".movebtn").forEach(b=>b.addEventListener("click",()=>doMove(+b.dataset.c)));
$("eq").addEventListener("click",evaluate);
$("clr").addEventListener("click",()=>{if(busy)return;curExpr="";setDisp("",0,"");$("step").textContent="ready";});
addEventListener("keydown",e=>{if(e.key>="0"&&e.key<="9")press(e.key);else if("+-*/()".includes(e.key))press(e.key);
  else if(e.key==="Enter"||e.key==="=")evaluate();else if(e.key==="c"||e.key==="Escape")$("clr").click();
  else if(e.key==="Backspace"){if(!busy){curExpr=curExpr.slice(0,-1);setDisp(curExpr);}}});
addEventListener("resize",()=>{layout();if(A.R)render(Math.min(A.frame,STEPS-1));});
