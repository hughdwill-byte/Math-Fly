<title>Scientific Calculator Fly</title>
<meta name="description" content="The real Janelia male-CNS fruit-fly connectome, wired into a scientific calculator that evaluates full expressions with precedence — and still moves.">
<style>
  :root{--bg:#060a12;--bg2:#0b1120;--panel:#0e1626;--panel2:#111c30;--line:#1c2a44;
    --ink:#e8eef9;--muted:#8ba0c2;--faint:#5a6f92;--exc:#37e0c6;--inh:#ff5f8d;--accent:#ffce54;
    --good:#4ce39a;--bad:#ff6b6b;--motor:#8ab4ff;--key:#16233b;--fn:#1a2a1f;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--ui:"Sora",system-ui,sans-serif;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#10203a 0,rgba(16,32,58,0) 55%),radial-gradient(900px 600px at 0% 110%,#191033 0,rgba(25,16,51,0) 50%),var(--bg);
    color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:10px;}.brand .fly{font-size:26px;filter:drop-shadow(0 0 10px rgba(55,224,198,.5));}
  h1{font-size:clamp(20px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;}
  .sub{color:var(--muted);font-size:13px;margin-left:auto;max-width:48ch;text-align:right;}.sub b{color:var(--exc);font-weight:600;}
  .real{display:inline-block;font-family:var(--mono);font-size:11px;color:#0b1220;background:var(--exc);border-radius:999px;padding:2px 9px;margin-bottom:12px;font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 340px;gap:16px;}@media(max-width:860px){.stage{grid-template-columns:1fr;}}
  .brainbox{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0,#0c1524 0,#070c15 70%);min-height:480px;}
  canvas#brain{display:block;width:100%;height:100%;}
  .phase{position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:13px;color:var(--muted);background:rgba(6,10,18,.55);border:1px solid var(--line);border-radius:999px;padding:5px 12px;backdrop-filter:blur(4px);max-width:80%;}
  .phase b{color:var(--accent);}
  .legend{position:absolute;bottom:10px;left:14px;display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--faint);}
  .legend span{display:flex;align-items:center;gap:6px;}.dot{width:9px;height:9px;border-radius:50%;}
  .calc{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px;display:flex;flex-direction:column;gap:10px;}
  .disp{background:#070d18;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;min-height:82px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
  .expr{font-family:var(--mono);font-size:16px;color:var(--ink);min-height:22px;overflow-x:auto;white-space:nowrap;}
  .ans{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,206,84,.3);line-height:1.1;overflow:hidden;text-overflow:ellipsis;}
  .accline{font-size:10px;color:var(--faint);text-align:right;min-height:14px;}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .fns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  button.k{height:44px;border:1px solid var(--line);border-radius:11px;background:var(--key);color:var(--ink);font-family:var(--mono);font-size:17px;cursor:pointer;}
  button.k:active{transform:translateY(1px);}button.k.op{color:var(--accent);}
  button.k.fn{background:var(--fn);color:var(--good);font-size:14px;font-family:var(--ui);font-weight:600;}
  button.k.eq{background:linear-gradient(180deg,#ffe08a,var(--accent));color:#12203a;font-weight:700;}
  button.k.clr{color:var(--bad);}button.k.wide{grid-column:span 2;}
  button:focus-visible{outline:2px solid var(--exc);outline-offset:2px;}
  .move{border-top:1px solid var(--line);padding-top:10px;}
  .move h3{margin:0 0 7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .movegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .movebtn{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--motor);cursor:pointer;font-size:15px;}
  .movebtn.on{background:var(--motor);color:#0b1220;box-shadow:0 0 14px rgba(138,180,255,.5);}
  .movestat{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;min-height:16px;}.movestat b{color:var(--motor);}
  .foot{margin-top:16px;color:var(--faint);font-size:12px;line-height:1.6;}.foot b{color:var(--muted);}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-right:6px;}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="fly">🪰</span><div><h1>Scientific Calculator Fly</h1></div></div>
    <div class="sub">The <b>real male-CNS connectome</b> evaluating whole expressions — with precedence — one elementary step at a time. Every dot is a real fly neuron.</div>
  </header>
  <span class="real" id="realtag">real fly</span>

  <div class="stage">
    <div class="brainbox">
      <canvas id="brain"></canvas>
      <div class="phase" id="phase">idle</div>
      <div class="legend">
        <span><i class="dot" style="background:var(--exc)"></i>excitatory</span>
        <span><i class="dot" style="background:var(--inh)"></i>inhibitory</span>
        <span><i class="dot" style="background:var(--accent)"></i>number input</span>
        <span><i class="dot" style="background:var(--motor)"></i>motor neuron</span>
      </div>
    </div>

    <aside class="calc">
      <div class="disp">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="ans" id="ans">0</div>
      </div>
      <div class="accline" id="acc">&nbsp;</div>
      <div class="fns">
        <button class="k fn" data-fn="square">x²</button>
        <button class="k fn" data-fn="sqrt">√</button>
        <button class="k fn" data-fn="sin">sin</button>
        <button class="k fn" data-fn="cos">cos</button>
        <button class="k fn" data-fn="log">log</button>
        <button class="k fn" data-fn="inv">1/x</button>
        <button class="k op" data-tok="(">(</button>
        <button class="k op" data-tok=")">)</button>
      </div>
      <div class="keys">
        <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button><button class="k op" data-tok="÷">÷</button>
        <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button><button class="k op" data-tok="×">×</button>
        <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button><button class="k op" data-tok="−">−</button>
        <button class="k clr" id="clr">C</button><button class="k" data-d="0">0</button><button class="k eq" id="eq">=</button><button class="k op" data-tok="+">+</button>
      </div>
      <div class="move">
        <h3>Basic movement (real motor neurons)</h3>
        <div class="movegrid">
          <button class="movebtn" data-c="1">◀</button><button class="movebtn" data-c="0">▲</button>
          <button class="movebtn" data-c="3">■</button><button class="movebtn" data-c="2">▶</button>
        </div>
        <div class="movestat" id="movestat"></div>
      </div>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script>
"use strict";
const B=/*__BUNDLE__*/null;
const $=id=>document.getElementById(id);
const M=B.meta,N=M.N,ALPHA=M.alpha,GAIN=M.gain,STEPS=M.steps,RWIN=M.read_win;
const SIGN=B.sign,POS=B.pos,SLOTS=B.slot_sets,CMDS=B.cmd_sets,READ=B.read,MOTOR=B.motor,OPS=B.ops,TR=B.trunk;
const E_PRE=B.edges.pre,E_POST=B.edges.post,E_W=B.edges.w,NE=E_W.length;
const SYM2NAME={"+":"add","−":"sub","-":"sub","×":"mul","*":"mul","÷":"div","/":"div"};

// ---- fly forward (mirrors mathfly.sci_fly) ----
function digs(x){return [Math.floor(x/100),Math.floor(x/10)%10,x%10];}
function runBin(a,b){const u=new Float32Array(N);
  digs(a).forEach((dg,si)=>{for(const n of SLOTS[si][dg])u[n]+=GAIN;});
  digs(b).forEach((dg,si)=>{for(const n of SLOTS[3+si][dg])u[n]+=GAIN;});
  return dyn(u);}
function runUn(a){const u=new Float32Array(N);digs(a).forEach((dg,si)=>{for(const n of SLOTS[si][dg])u[n]+=GAIN;});return dyn(u);}
function runCmd(c){const u=new Float32Array(N);for(const n of CMDS[c])u[n]+=GAIN;return dyn(u);}
function dyn(u){let x=new Float32Array(N);const R=[];
  for(let t=0;t<STEPS;t++){const r=new Float32Array(N);for(let i=0;i<N;i++)r[i]=Math.tanh(x[i]);
    const rec=new Float32Array(N);for(let k=0;k<NE;k++)rec[E_POST[k]]+=E_W[k]*r[E_PRE[k]];
    const xn=new Float32Array(N);for(let i=0;i<N;i++)xn[i]=(1-ALPHA)*x[i]+ALPHA*(rec[i]+u[i]);
    const rt=new Float32Array(N);for(let i=0;i<N;i++)rt[i]=Math.tanh(xn[i]);R.push(rt);x=xn;}return R;}
function feat(R,neurons,upTo){const F=neurons.length,m=new Float32Array(F+1),lo=STEPS-RWIN,hi=Math.min(upTo+1,STEPS),cnt=Math.max(1,hi-lo);
  for(let t=lo;t<hi;t++){const rt=R[t];for(let j=0;j<F;j++)m[j]+=rt[neurons[j]];}for(let j=0;j<F;j++)m[j]/=cnt;m[F]=1;return m;}
function mvec(Wr,x){const o=new Float32Array(Wr.length);for(let i=0;i<Wr.length;i++){let s=0;const w=Wr[i];for(let j=0;j<x.length;j++)s+=w[j]*x[j];o[i]=s;}return o;}
function addb(v,b){const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]+b[i];return o;}
function relu(v){const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]>0?v[i]:0;return o;}
function trunk(f){return relu(addb(mvec(TR.W2,relu(addb(mvec(TR.W1,f),TR.b1))),TR.b2));}
function mlp(m,f){const h1=relu(addb(mvec(m.W1,f),m.b1)),h2=relu(addb(mvec(m.W2,h1),m.b2));return addb(mvec(m.W3,h2),m.b3);}
function argseg(o,off){let bi=0,bv=-1e9;for(let i=0;i<10;i++)if(o[off+i]>bv){bv=o[off+i];bi=i;}return bi;}
function headOut(op,R,upTo){const f=feat(R,READ,upTo);return op.kind==="trunk"?addb(mvec(op.W,trunk(f)),op.hb):mlp(op.mlp,f);}
function decode(op,o){let mag=0;for(let d=0;d<op.K;d++)mag+=argseg(o,d*10)*Math.pow(10,d);
  let sign=op.signed&&o[op.K*10+1]>o[op.K*10]?-1:1;return sign*mag/Math.pow(10,op.dec);}

// ---- canvas ----
const cv=$("brain"),ctx=cv.getContext("2d");let CW,CH,PTS=[],edgeCanvas=null;
function layout(){const dpr=Math.min(2,devicePixelRatio||1),r=cv.parentElement.getBoundingClientRect();
  CW=r.width;CH=Math.max(480,r.height);cv.width=CW*dpr;cv.height=CH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const px=26,py=30;PTS=POS.map(p=>[px+p[0]*(CW-2*px),py+p[1]*(CH-2*py)]);drawEdges();}
function drawEdges(){const dpr=Math.min(2,devicePixelRatio||1);edgeCanvas=document.createElement("canvas");
  edgeCanvas.width=CW*dpr;edgeCanvas.height=CH*dpr;const ec=edgeCanvas.getContext("2d");ec.setTransform(dpr,0,0,dpr,0,0);ec.lineWidth=0.5;
  const st=Math.max(1,Math.floor(NE/6000));for(let k=0;k<NE;k+=st){const A=PTS[E_PRE[k]],Bp=PTS[E_POST[k]];
    ec.strokeStyle=E_W[k]<0?"rgba(255,95,141,0.045)":"rgba(55,224,198,0.045)";ec.beginPath();ec.moveTo(A[0],A[1]);ec.lineTo(Bp[0],Bp[1]);ec.stroke();}}
function render(frame){ctx.clearRect(0,0,CW,CH);
  if(edgeCanvas){const dpr=Math.min(2,devicePixelRatio||1);ctx.drawImage(edgeCanvas,0,0,edgeCanvas.width/dpr,edgeCanvas.height/dpr);}
  const R=S.R;ctx.globalCompositeOperation="lighter";
  for(let i=0;i<N;i++){const act=R?Math.abs(R[frame][i]):0,base=SIGN[i]>=0?[55,224,198]:[255,95,141],p=PTS[i],rad=1.2+act*3.4,al=0.09+act*0.85;
    if(act>0.12){ctx.shadowBlur=6+act*15;ctx.shadowColor=`rgba(${base[0]},${base[1]},${base[2]},${al})`;}else ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(${base[0]},${base[1]},${base[2]},${al})`;ctx.beginPath();ctx.arc(p[0],p[1],rad,0,6.2832);ctx.fill();}
  ctx.shadowBlur=0;ctx.globalCompositeOperation="source-over";
  if(S.activeSets){ctx.strokeStyle="rgba(255,206,84,.6)";ctx.lineWidth=1.4;for(const set of S.activeSets)for(const n of set){const p=PTS[n];ctx.beginPath();ctx.arc(p[0],p[1],3,0,6.2832);ctx.stroke();}}
  ctx.strokeStyle="rgba(138,180,255,.3)";ctx.lineWidth=1;for(const i of MOTOR){const p=PTS[i];ctx.beginPath();ctx.arc(p[0],p[1],2.1,0,6.2832);ctx.stroke();}}

// ---- expression parsing (shunting-yard with precedence) ----
function tokenize(str){const t=[];let i=0;str=str.replace(/[−]/g,"-").replace(/[×]/g,"*").replace(/[÷]/g,"/");
  while(i<str.length){const c=str[i];
    if(c>="0"&&c<="9"){let n="";while(i<str.length&&str[i]>="0"&&str[i]<="9"){n+=str[i++];}t.push({t:"num",v:+n});}
    else if("+-*/".includes(c)){t.push({t:"op",v:c});i++;}
    else if(c==="("||c===")"){t.push({t:c});i++;}
    else i++;}
  return t;}
const PREC={"+":1,"-":1,"*":2,"/":2};
function toRPN(tok){const out=[],ops=[];
  for(const k of tok){
    if(k.t==="num")out.push(k);
    else if(k.t==="op"){while(ops.length&&ops[ops.length-1].t==="op"&&PREC[ops[ops.length-1].v]>=PREC[k.v])out.push(ops.pop());ops.push(k);}
    else if(k.t==="(")ops.push(k);
    else if(k.t===")"){while(ops.length&&ops[ops.length-1].t!=="(")out.push(ops.pop());ops.pop();}}
  while(ops.length)out.push(ops.pop());return out;}

// ---- state / animation ----
const S={R:null,frame:0,playing:false,activeSets:null,queue:[],onDone:null,acc:0};
let raf=null;
function animate(runFn,activeSets,label,accTxt,onEnd){S.R=runFn();S.frame=0;S.activeSets=activeSets;S.label=label;S.accTxt=accTxt;S.onEnd=onEnd;play();}
function play(){S.playing=true;if(!raf)raf=requestAnimationFrame(stepAnim);}
function stepAnim(){if(!S.playing){raf=null;return;}S.acc++;if(S.acc>=3){S.acc=0;S.frame++;
  if(S.frame>=STEPS){S.frame=STEPS-1;S.playing=false;render(S.frame);if(S.onEnd){const cb=S.onEnd;S.onEnd=null;cb();}return;}
  render(S.frame);$("phase").innerHTML=S.label;}raf=requestAnimationFrame(stepAnim);}

function applyUnary(name,x,cb){const op=OPS[name];x=Math.min(op.a[1],Math.max(op.a[0],Math.round(x)));
  animate(()=>runUn(x),[SLOTS[0][digs(x)[0]],SLOTS[1][digs(x)[1]],SLOTS[2][digs(x)[2]]],
    `computing <b>${op.sym}(${x})</b>`,accFor(name),()=>{const R=S.R,o=headOut(op,R,STEPS-1),v=decode(op,o);cb(v);});}
function applyBinary(name,a,b,cb){const op=OPS[name];
  const A=Math.min(op.a[1],Math.max(op.a[0],Math.round(a))),Bb=Math.min(op.b[1],Math.max(op.b[0],Math.round(b)));
  const sets=[SLOTS[0][digs(A)[0]],SLOTS[1][digs(A)[1]],SLOTS[2][digs(A)[2]],SLOTS[3][digs(Bb)[0]],SLOTS[4][digs(Bb)[1]],SLOTS[5][digs(Bb)[2]]];
  animate(()=>runBin(A,Bb),sets,`computing <b>${A} ${op.sym} ${Bb}</b>`,accFor(name,Math.max(a,b)),()=>{const R=S.R,o=headOut(op,R,STEPS-1),v=decode(op,o);cb(v);});}
function accFor(name,maxOperand){const op=OPS[name];let s=`fly scores <b>${Math.round(op.accuracy*100)}%</b> on ${name} (range ${op.a[0]}–${op.a[1]})`;
  if(maxOperand!=null&&maxOperand>op.a[1])s+=` — value ${maxOperand} is past its range`;return s;}

// evaluate an RPN stream by driving the fly for each op, in sequence
function evalRPN(rpn,done){const st=[];let idx=0;
  function next(){
    if(idx>=rpn.length){done(st.length?st[st.length-1]:0);return;}
    const k=rpn[idx++];
    if(k.t==="num"){st.push(k.v);next();}
    else{const b=st.pop(),a=st.pop();const name=SYM2NAME[k.v];
      applyBinary(name,a,b,(v)=>{st.push(v);setDisp(curExpr,fmt(OPS[name],v),S.accTxt);next();});}
  }
  next();
}

// ---- calculator input ----
let curExpr="";
function fmt(op,v){return op&&op.dec>0?v.toFixed(op.dec):String(Math.round(v));}
function setDisp(expr,ans,accTxt){$("expr").textContent=expr||" ";$("ans").textContent=ans;$("acc").innerHTML=accTxt||"&nbsp;";}
function pressTok(t){curExpr+=t;setDisp(curExpr,$("ans").textContent);}
function pressDigit(d){curExpr+=d;setDisp(curExpr,$("ans").textContent);}
function pressFn(name){ // apply function to the whole current expression's value, or last number
  evaluate(true,name);}
function clearAll(){curExpr="";setDisp("",0);}
function evaluate(isFn,fnName){
  const tok=tokenize(curExpr);if(!tok.length&&!isFn)return;
  const rpn=toRPN(tok);
  document.querySelectorAll(".movebtn").forEach(x=>x.classList.remove("on"));$("movestat").textContent="";
  evalRPN(rpn,(val)=>{
    if(isFn){applyUnary(fnName,val,(fv)=>{curExpr=String(fmt(OPS[fnName],fv));
      $("expr").textContent=`${OPS[fnName].sym}(${Math.round(val)})`;$("ans").textContent=fmt(OPS[fnName],fv);$("acc").innerHTML=S.accTxt;});}
    else{curExpr=String(fmt(OPS.add,val));$("ans").textContent=Number.isInteger(val)?val:val.toFixed(3);}
  });
}
function doMove(c){document.querySelectorAll(".movebtn").forEach(x=>x.classList.toggle("on",+x.dataset.c===c));
  animate(()=>runCmd(c),[CMDS[c]],'driving <b>motor neurons</b>','',()=>{const f=feat(S.R,MOTOR,STEPS-1);let bi=0,bv=-1e9;const o=mvec(B.movement.W_move,f);for(let i=0;i<o.length;i++)if(o[i]>bv){bv=o[i];bi=i;}$("movestat").innerHTML=`motor output → <b>${B.movement.commands[bi]}</b> ✓`;});}

document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>pressDigit(b.dataset.d));
document.querySelectorAll("[data-tok]").forEach(b=>b.onclick=()=>pressTok(b.dataset.tok));
document.querySelectorAll("[data-fn]").forEach(b=>b.onclick=()=>pressFn(b.dataset.fn));
document.querySelectorAll(".movebtn").forEach(b=>b.onclick=()=>doMove(+b.dataset.c));
$("eq").onclick=()=>evaluate(false);$("clr").onclick=clearAll;
addEventListener("keydown",e=>{if(e.key>="0"&&e.key<="9")pressDigit(e.key);
  else if("+-*/()".includes(e.key))pressTok(e.key);
  else if(e.key==="Enter"||e.key==="=")evaluate(false);
  else if(e.key==="c"||e.key==="Escape")clearAll();else if(e.key==="Backspace"){curExpr=curExpr.slice(0,-1);setDisp(curExpr,$("ans").textContent);}});
addEventListener("resize",()=>{layout();if(S.R)render(S.frame);});
$("realtag").textContent=M.source.includes("real")?"REAL male-CNS connectome":M.source;
$("foot").innerHTML=`<span class="pill">${N.toLocaleString()} real neurons</span><span class="pill">${M.n_synapses.toLocaleString()} synapses</span>`+
  `<span class="pill">${M.movement_neurons} motor neurons</span><span class="pill">expression evaluator</span><br>`+
  `<b>How it works:</b> type an expression like <b>2 + 3 × 4</b>; a precedence parser breaks it into elementary steps and the real fly computes each one — you watch its neurons fire per step. + − work to 999 (they generalise), × ÷ and functions are exact to 99, transcendentals to 3 decimals. Blue motor neurons are the fly's real movement hardware, kept intact.`;
layout();curExpr="2+3×4";setDisp("2 + 3 × 4",0);evaluate(false);
