<title>Scientific Calculator Fly</title>
<meta name="description" content="The real Janelia male-CNS fruit-fly connectome, shown in its true anatomy, evaluating whole expressions one step at a time — and still able to move.">
<style>
  :root{--bg:#060a12;--bg2:#0b1120;--panel:#0e1626;--panel2:#111c30;--line:#1c2a44;
    --ink:#e8eef9;--muted:#8ba0c2;--faint:#5a6f92;--exc:#37e0c6;--inh:#ff5f8d;--accent:#ffce54;
    --good:#4ce39a;--bad:#ff6b6b;--motor:#8ab4ff;--key:#16233b;--fn:#1a2a1f;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--ui:"Sora",system-ui,sans-serif;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#10203a 0,rgba(16,32,58,0) 55%),radial-gradient(900px 600px at 0% 110%,#191033 0,rgba(25,16,51,0) 50%),var(--bg);
    color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:10px;}.brand .fly{font-size:26px;filter:drop-shadow(0 0 10px rgba(55,224,198,.5));}
  h1{font-size:clamp(20px,3.4vw,30px);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;}
  .sub{color:var(--muted);font-size:13px;margin-left:auto;max-width:46ch;text-align:right;}.sub b{color:var(--exc);font-weight:600;}
  .real{display:inline-block;font-family:var(--mono);font-size:11px;color:#0b1220;background:var(--exc);border-radius:999px;padding:2px 9px;margin-bottom:12px;font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 330px;gap:16px;}@media(max-width:860px){.stage{grid-template-columns:1fr;}}
  .brainbox{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,#0c1524 0,#070c15 72%);min-height:560px;}
  canvas#brain{display:block;width:100%;height:100%;}
  .status{position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none;}
  .status .step{display:inline-block;font-family:var(--mono);font-size:15px;color:var(--ink);background:rgba(6,10,18,.7);border:1px solid var(--line);border-radius:999px;padding:6px 16px;backdrop-filter:blur(4px);}
  .status .step b{color:var(--accent);}
  .legend{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--faint);}
  .legend span{display:flex;align-items:center;gap:6px;}.dot{width:9px;height:9px;border-radius:50%;}
  .fxtoggle{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    font-family:var(--mono);background:rgba(6,10,18,.7);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
    cursor:pointer;user-select:none;backdrop-filter:blur(4px);}
  .fxtoggle input{accent-color:var(--exc);cursor:pointer;margin:0;}
  .calc{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px;display:flex;flex-direction:column;gap:10px;}
  .disp{background:#070d18;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
  .expr{font-family:var(--mono);font-size:16px;color:var(--ink);min-height:22px;overflow-x:auto;white-space:nowrap;}
  .ans{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 18px rgba(255,206,84,.3);}
  .accline{font-size:10px;color:var(--faint);text-align:right;min-height:14px;}
  .chkrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;cursor:pointer;user-select:none;
    border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#070d18;}
  .chkrow input{accent-color:var(--good);cursor:pointer;margin:0;}
  .chklab{color:var(--faint);letter-spacing:.02em;}
  .chkval{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);}
  .chkval .ok{color:var(--good);font-weight:700;}.chkval .bad{color:var(--bad);font-weight:700;}.chkval small{color:var(--faint);font-weight:400;}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .fns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  button.k{height:44px;border:1px solid var(--line);border-radius:11px;background:var(--key);color:var(--ink);font-family:var(--mono);font-size:17px;cursor:pointer;user-select:none;}
  button.k:hover{border-color:var(--faint);}button.k:active{transform:translateY(1px);}button.k.op{color:var(--accent);}
  button.k.fn{background:var(--fn);color:var(--good);font-size:14px;font-family:var(--ui);font-weight:600;}
  button.k.eq{background:linear-gradient(180deg,#ffe08a,var(--accent));color:#12203a;font-weight:700;}
  button.k.clr{color:var(--bad);}
  button:focus-visible{outline:2px solid var(--exc);outline-offset:2px;}
  .move{border-top:1px solid var(--line);padding-top:10px;}
  .move h3{margin:0 0 7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .movegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .movebtn{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--motor);cursor:pointer;font-size:15px;}
  .movebtn.on{background:var(--motor);color:#0b1220;box-shadow:0 0 14px rgba(138,180,255,.5);}
  .movestat{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;min-height:16px;}.movestat b{color:var(--motor);}
  .foot{margin-top:16px;color:var(--faint);font-size:12px;line-height:1.6;}.foot b{color:var(--muted);}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-right:6px;}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="fly">🪰</span><div><h1>Scientific Calculator Fly</h1></div></div>
    <div class="sub">The <b>real male-CNS connectome</b>, drawn in its true anatomy, evaluating whole expressions one elementary step at a time.</div>
  </header>
  <span class="real" id="realtag">real fly</span>

  <div class="stage">
    <div class="brainbox">
      <canvas id="brain"></canvas>
      <label class="fxtoggle" title="Turn the idle shimmer, heartbeat and spark trails on or off"><input type="checkbox" id="fx" checked> effects</label>
      <div class="status"><span class="step" id="step">ready</span></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--exc)"></i>excitatory</span>
        <span><i class="dot" style="background:var(--inh)"></i>inhibitory</span>
        <span><i class="dot" style="background:var(--accent)"></i>number input</span>
        <span><i class="dot" style="background:var(--motor)"></i>motor neuron</span>
      </div>
    </div>

    <aside class="calc">
      <div class="disp">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="ans" id="ans">0</div>
      </div>
      <div class="accline" id="acc">&nbsp;</div>
      <label class="chkrow" title="Turn on an ordinary calculator that independently checks whether the fly's answer is correct">
        <input type="checkbox" id="chk"><span class="chklab">✓ checker</span><span class="chkval" id="chkval">off</span></label>
      <div class="fns">
        <button class="k fn" data-fn="square">x²</button>
        <button class="k fn" data-fn="sqrt">√</button>
        <button class="k fn" data-fn="sin">sin</button>
        <button class="k fn" data-fn="cos">cos</button>
        <button class="k fn" data-fn="log">log</button>
        <button class="k fn" data-fn="inv">1/x</button>
        <button class="k op" data-tok="(">(</button>
        <button class="k op" data-tok=")">)</button>
      </div>
      <div class="keys">
        <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button><button class="k op" data-tok="÷">÷</button>
        <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button><button class="k op" data-tok="×">×</button>
        <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button><button class="k op" data-tok="−">−</button>
        <button class="k clr" id="clr">C</button><button class="k" data-d="0">0</button><button class="k eq" id="eq">=</button><button class="k op" data-tok="+">+</button>
      </div>
      <div class="move">
        <h3>Basic movement (real motor neurons)</h3>
        <div class="movegrid">
          <button class="movebtn" data-c="1">◀</button><button class="movebtn" data-c="0">▲</button>
          <button class="movebtn" data-c="3">■</button><button class="movebtn" data-c="2">▶</button>
        </div>
        <div class="movestat" id="movestat"></div>
      </div>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script>
"use strict";
const B=/*__BUNDLE__*/null;
const $=id=>document.getElementById(id);
const M=B.meta,N=M.N,ALPHA=M.alpha,GAIN=M.gain,STEPS=M.steps,RWIN=M.read_win;
const SIGN=B.sign,POS=B.pos,SLOTS=B.slot_sets,CMDS=B.cmd_sets,READ=B.read,MOTOR=B.motor,OPS=B.ops,TR=B.trunk;
const E_PRE=B.edges.pre,E_POST=B.edges.post,E_W=B.edges.w,NE=E_W.length;
const SYM2NAME={"+":"add","−":"sub","-":"sub","×":"mul","*":"mul","÷":"div","/":"div"};

// ---------- fly forward (mirrors mathfly.sci_fly) ----------
function digs(x){x=Math.max(0,Math.round(x));return [Math.floor(x/100)%10,Math.floor(x/10)%10,x%10];}
function dyn(u){let x=new Float32Array(N);const R=[];
  for(let t=0;t<STEPS;t++){const r=new Float32Array(N);for(let i=0;i<N;i++)r[i]=Math.tanh(x[i]);
    const rec=new Float32Array(N);for(let k=0;k<NE;k++)rec[E_POST[k]]+=E_W[k]*r[E_PRE[k]];
    const xn=new Float32Array(N);for(let i=0;i<N;i++)xn[i]=(1-ALPHA)*x[i]+ALPHA*(rec[i]+u[i]);
    const rt=new Float32Array(N);for(let i=0;i<N;i++)rt[i]=Math.tanh(xn[i]);R.push(rt);x=xn;}return R;}
function binSets(a,b){const s=[];digs(a).forEach((d,i)=>s.push(SLOTS[i][d]));digs(b).forEach((d,i)=>s.push(SLOTS[3+i][d]));return s;}
function unSets(a){const s=[];digs(a).forEach((d,i)=>s.push(SLOTS[i][d]));return s;}
function drive(sets){const u=new Float32Array(N);for(const set of sets)for(const n of set)u[n]+=GAIN;return u;}
function feat(R,neurons,upTo){const F=neurons.length,m=new Float32Array(F+1),lo=STEPS-RWIN,hi=Math.min(upTo+1,STEPS),cnt=Math.max(1,hi-lo);
  for(let t=lo;t<hi;t++){const rt=R[t];for(let j=0;j<F;j++)m[j]+=rt[neurons[j]];}for(let j=0;j<F;j++)m[j]/=cnt;m[F]=1;return m;}
function mvec(Wr,x){const o=new Float32Array(Wr.length);for(let i=0;i<Wr.length;i++){let s=0;const w=Wr[i];for(let j=0;j<x.length;j++)s+=w[j]*x[j];o[i]=s;}return o;}
function addb(v,b){const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]+b[i];return o;}
function relu(v){const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]>0?v[i]:0;return o;}
function trunk(f){return relu(addb(mvec(TR.W2,relu(addb(mvec(TR.W1,f),TR.b1))),TR.b2));}
function mlp(m,f){const h1=relu(addb(mvec(m.W1,f),m.b1)),h2=relu(addb(mvec(m.W2,h1),m.b2));return addb(mvec(m.W3,h2),m.b3);}
function argseg(o,off){let bi=0,bv=-1e9;for(let i=0;i<10;i++)if(o[off+i]>bv){bv=o[off+i];bi=i;}return bi;}
function decodeVal(op,R){const f=feat(R,READ,STEPS-1);const o=op.kind==="trunk"?addb(mvec(op.W,trunk(f)),op.hb):mlp(op.mlp,f);
  let mag=0;for(let d=0;d<op.K;d++)mag+=argseg(o,d*10)*Math.pow(10,d);
  let sign=op.signed&&o[op.K*10+1]>o[op.K*10]?-1:1;return sign*mag/Math.pow(10,op.dec);}
function clampToOp(op,v){return Math.min(op.a[1],Math.max(op.a[0],Math.round(v)));}
function fmt(op,v){return op&&op.dec>0?(+v).toFixed(op.dec):String(Math.round(v));}

// ---------- anatomical canvas (letterboxed, aspect preserved) ----------
const cv=$("brain"),ctx=cv.getContext("2d");let CW,CH,PTS=[],edgeCanvas=null,BOX=null,trailCanvas=null,trailCtx=null;
const MAXDPR=1.5;   // cap the device-pixel-ratio: retina screens otherwise fill 4x the pixels every frame for no visible gain
function layout(){const dpr=Math.min(MAXDPR,devicePixelRatio||1),r=cv.parentElement.getBoundingClientRect();
  CW=r.width;CH=Math.max(560,r.height);cv.width=CW*dpr;cv.height=CH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  trailCanvas=document.createElement("canvas");trailCanvas.width=CW*dpr;trailCanvas.height=CH*dpr;
  trailCtx=trailCanvas.getContext("2d");trailCtx.setTransform(dpr,0,0,dpr,0,0);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of POS){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
  const pad=30,s=Math.min((CW-2*pad)/(x1-x0),(CH-2*pad)/(y1-y0)),ox=(CW-(x1-x0)*s)/2,oy=(CH-(y1-y0)*s)/2;
  PTS=POS.map(p=>[ox+(p[0]-x0)*s,oy+(p[1]-y0)*s]);
  BOX={x0:ox,y0:oy,x1:ox+(x1-x0)*s,y1:oy+(y1-y0)*s};drawEdges();}
function drawEdges(){const dpr=Math.min(MAXDPR,devicePixelRatio||1);edgeCanvas=document.createElement("canvas");
  edgeCanvas.width=CW*dpr;edgeCanvas.height=CH*dpr;const ec=edgeCanvas.getContext("2d");ec.setTransform(dpr,0,0,dpr,0,0);ec.lineWidth=0.5;
  const st=Math.max(1,Math.floor(NE/7000));for(let k=0;k<NE;k+=st){const A=PTS[E_PRE[k]],Bp=PTS[E_POST[k]];
    ec.strokeStyle=E_W[k]<0?"rgba(255,95,141,0.05)":"rgba(55,224,198,0.05)";ec.beginPath();ec.moveTo(A[0],A[1]);ec.lineTo(Bp[0],Bp[1]);ec.stroke();}
  // faint region labels
  ec.fillStyle="rgba(139,160,194,0.28)";ec.font="11px 'JetBrains Mono',monospace";ec.textAlign="center";
  ec.fillText("B R A I N",(BOX.x0+BOX.x1)/2,BOX.y0+14);
  ec.fillText("N E R V E   C O R D",(BOX.x0+BOX.x1)/2,BOX.y1-6);
  // motor-neuron rings never move -> bake them into the static layer instead of re-stroking ~2,000 arcs every frame
  ec.strokeStyle="rgba(138,180,255,.3)";ec.lineWidth=1;
  for(const i of MOTOR){const p=PTS[i];ec.beginPath();ec.arc(p[0],p[1],2,0,6.2832);ec.stroke();}}
// strongest synapses -> candidate sparks (signal visibly travelling on wires)
let SPARK=[];function pickSparks(){SPARK=[...Array(NE).keys()].sort((p,q)=>Math.abs(E_W[q])-Math.abs(E_W[p])).slice(0,2600);}
const DPR=()=>Math.min(MAXDPR,devicePixelRatio||1);
// pre-rendered soft "glow dot" sprites, one per E/I colour. Drawing a cached sprite
// per neuron is ~10x cheaper than an arc + shadowBlur, and shadowBlur was the main
// thing that stalled weaker machines when the heartbeat lit thousands of neurons at once.
function makeGlow(rgb){const s=48,c=document.createElement("canvas");c.width=c.height=s;const g=c.getContext("2d");
  const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0,`rgba(${rgb},1)`);grd.addColorStop(0.28,`rgba(${rgb},0.55)`);grd.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=grd;g.fillRect(0,0,s,s);return c;}
const GLOW=[makeGlow("55,224,198"),makeGlow("255,95,141")];
function paint(act,showInputs,R,frame){ctx.clearRect(0,0,CW,CH);
  if(edgeCanvas)ctx.drawImage(edgeCanvas,0,0,edgeCanvas.width/DPR(),edgeCanvas.height/DPR());
  // --- signal sparks travel on a fading trail layer, so they leave streaks on the wires (only during a solve) ---
  if(FX&&trailCtx&&R){
    trailCtx.globalCompositeOperation="destination-out";           // fade existing trail toward transparent
    trailCtx.fillStyle="rgba(0,0,0,0.12)";trailCtx.fillRect(0,0,CW,CH);
    if(R){trailCtx.globalCompositeOperation="lighter";const src=R[Math.max(0,frame-1)],ph=(clock*0.05)%1;
      for(const k of SPARK){const a=Math.abs(src[E_PRE[k]]);if(a<0.28)continue;
        const P=PTS[E_PRE[k]],Q=PTS[E_POST[k]],col=E_W[k]<0?"255,95,141":"55,224,198";
        const fr=(ph+(E_PRE[k]%9)/9)%1,x=P[0]+(Q[0]-P[0])*fr,y=P[1]+(Q[1]-P[1])*fr,al=Math.min(.85,a*.8);
        trailCtx.fillStyle=`rgba(${col},${al})`;trailCtx.beginPath();trailCtx.arc(x,y,1.1+a*1.7,0,6.2832);trailCtx.fill();}}
    ctx.globalCompositeOperation="lighter";ctx.drawImage(trailCanvas,0,0,trailCanvas.width/DPR(),trailCanvas.height/DPR());
  }
  // --- neurons: additive cached glow sprites (no per-neuron shadowBlur) ---
  ctx.globalCompositeOperation="lighter";
  for(let i=0;i<N;i++){const a=act(i);if(a<0.02)continue;                 // skip near-dark neurons entirely
    const p=PTS[i],g=GLOW[SIGN[i]>=0?0:1],rad=2.2+a*10;
    ctx.globalAlpha=a<1?0.1+a*0.9:1;ctx.drawImage(g,p[0]-rad,p[1]-rad,rad*2,rad*2);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  if(showInputs&&A.inputSets){ctx.strokeStyle="rgba(255,206,84,.75)";ctx.lineWidth=1.6;for(const set of A.inputSets)for(const n of set){const p=PTS[n];ctx.beginPath();ctx.arc(p[0],p[1],3.6,0,6.2832);ctx.stroke();}}}
// idle "alive" state: a slow spatial shimmer, modulated by a lub-dub heartbeat so the whole brain pulses
function heartbeat(){const x=(clock%78)/78,g=(c,w)=>Math.exp(-((x-c)*(x-c))/(w*w));return g(0.06,0.045)+0.65*g(0.20,0.05);}
function ambientAct(i){const p=POS[i],w=Math.max(0,Math.sin(p[1]*7-clock*0.028)*Math.cos(p[0]*6+clock*0.019));
  return 0.04+0.09*w+heartbeat()*(0.12+0.10*w);}
// calm view: a fixed, clock-independent brightness map (no shimmer, no heartbeat, no sparks)
function calmAct(i){const p=POS[i];return 0.06+0.07*Math.max(0,Math.sin(p[1]*7)*Math.cos(p[0]*6));}
let FX=true,staticDrawn=false;

// ---------- persistent animation loop (always alive) ----------
const A={R:null,frame:0,inputSets:null,onDone:null,adv:1};
let tc=0,_lastR=null,clock=0;const SPEED=3;
function runAnim(R,inputSets,label,onDone,quick){A.R=R;A.frame=0;A.inputSets=inputSets;A.onDone=onDone;A.adv=quick?3:1;_lastR=R;
  if(trailCtx)trailCtx.clearRect(0,0,CW,CH);   // start each solve with a clean trail
  $("step").innerHTML=label;}
// The loop is frame-rate capped (idle 30fps, solving 40fps) and pauses entirely when the
// tab is hidden or the brain is scrolled off-screen, so it never pegs a CPU in the background.
let _last=0,paused=false;
function loop(ts){requestAnimationFrame(loop);
  if(paused)return;
  const minDt=1000/(A.R?40:30);if(ts-_last<minDt)return;_last=ts;
  clock++;
  if(A.R){staticDrawn=false;const f=Math.min(A.frame,STEPS-1);paint(i=>Math.abs(A.R[f][i]),true,A.R,f);
    if(A.frame>=STEPS-1){const cb=A.onDone;A.onDone=null;A.R=null;if(cb)cb();}
    else{tc++;if(tc>=SPEED){tc=0;A.frame+=A.adv;}}}
  else if(FX)paint(ambientAct,false,null,0);         // idle shimmer + heartbeat
  else if(!staticDrawn){paint(calmAct,false,null,0);staticDrawn=true;}   // calm view: draw once, then hold
}
function lastR(){return _lastR;}
// pause when the page is hidden or the canvas is scrolled out of view
let _vis=true,_onscr=true;function updPause(){paused=!_vis||!_onscr;if(!paused)staticDrawn=false;}
document.addEventListener("visibilitychange",()=>{_vis=!document.hidden;updPause();});
try{new IntersectionObserver(es=>{_onscr=es[0].isIntersecting;updPause();},{threshold:0}).observe(cv);}catch(e){}

// ---------- expression parsing (shunting-yard, precedence) ----------
function tokenize(str){str=str.replace(/[−]/g,"-").replace(/[×]/g,"*").replace(/[÷]/g,"/");const t=[];let i=0;
  while(i<str.length){const c=str[i];
    if(c>="0"&&c<="9"){let n="";while(i<str.length&&str[i]>="0"&&str[i]<="9")n+=str[i++];t.push({t:"num",v:+n});}
    else if("+-*/".includes(c)){t.push({t:"op",v:c});i++;}
    else if(c==="("||c===")"){t.push({t:c});i++;}else i++;}return t;}
const PREC={"+":1,"-":1,"*":2,"/":2};
function toRPN(tok){const out=[],ops=[];for(const k of tok){
  if(k.t==="num")out.push(k);
  else if(k.t==="op"){while(ops.length&&ops[ops.length-1].t==="op"&&PREC[ops[ops.length-1].v]>=PREC[k.v])out.push(ops.pop());ops.push(k);}
  else if(k.t==="(")ops.push(k);
  else if(k.t===")"){while(ops.length&&ops[ops.length-1].t!=="(")out.push(ops.pop());ops.pop();}}
  while(ops.length)out.push(ops.pop());return out;}

// ---------- evaluate an expression by driving the fly per step ----------
let curExpr="",busy=false;
function setDisp(expr,ans,acc){$("expr").textContent=expr||" ";if(ans!==undefined)$("ans").textContent=ans;$("acc").innerHTML=acc||"&nbsp;";}
function accLine(name,maxOperand){const op=OPS[name];const nm={add:"addition",sub:"subtraction",mul:"multiplication",div:"division",square:"squares",sqrt:"√",sin:"sine",cos:"cosine",log:"log₁₀",inv:"1/x"}[name];
  let s=`fly scores <b>${Math.round(op.accuracy*100)}%</b> on ${nm} (${op.a[0]}–${op.a[1]})`;
  if(maxOperand!=null&&maxOperand>op.a[1])s+=` — ${maxOperand} exceeds its range`;return s;}

function clampB(op,b){return Math.min(op.b[1],Math.max(op.b[0],Math.round(b)));}

// ---------- the fly as an ALU: exact primitives, animated ----------
// A single primitive fly operation, returned as a Promise so we can compose.
function flyBin(name,a,b,quick){return new Promise(res=>{const op=OPS[name];const A2=clampToOp(op,a),B2=clampB(op,b),sets=binSets(A2,B2);
  runAnim(dyn(drive(sets)),sets,`brain computing <b>${A2} ${op.sym} ${B2}</b>`,()=>res(decodeVal(op,lastR())),quick);});}
function flyUn(name,a){return new Promise(res=>{const op=OPS[name];const A2=clampToOp(op,a),sets=unSets(A2);
  runAnim(dyn(drive(sets)),sets,`brain computing <b>${op.sym}(${A2})</b>`,()=>res(decodeVal(op,lastR())));});}

// Big-integer arithmetic composed from the fly's exact primitives -- the fly
// does every real add/sub/mul; digit placement (×10ⁿ) is bookkeeping, exactly
// as a person shifts columns in long multiplication.
function setStage(s){$("step").innerHTML=s;}
async function addBig(x,y){x=Math.round(x);y=Math.round(y);
  if(x<=999&&y<=999)return await flyBin("add",x,y);
  let carry=0,res=0,place=1;
  while(x>0||y>0){const s=await flyBin("add",x%1000,y%1000,true);const t=s+carry;res+=(t%1000)*place;carry=Math.floor(t/1000);place*=1000;x=Math.floor(x/1000);y=Math.floor(y/1000);}
  return res+carry*place;}
async function subBig(x,y){x=Math.round(x);y=Math.round(y);
  if(x<y)return -(await subBig(y,x));
  if(x<=999&&y<=999)return await flyBin("sub",x,y);
  let borrow=0,res=0,place=1;
  while(x>0||y>0){let a=x%1000-borrow,b=y%1000;if(a<b){a+=1000;borrow=1;}else borrow=0;const d=await flyBin("sub",a,b,true);res+=d*place;place*=1000;x=Math.floor(x/1000);y=Math.floor(y/1000);}
  return res;}
async function mulBig(a,b){a=Math.round(a);b=Math.round(b);
  if(a<=99&&b<=99)return await flyBin("mul",a,b);
  const aH=Math.floor(a/100),aL=a%100,bH=Math.floor(b/100),bL=b%100;   // base-100 grid
  const p4=await flyBin("mul",aL,bL,true),p3=await flyBin("mul",aL,bH,true),
        p2=await flyBin("mul",aH,bL,true),p1=await flyBin("mul",aH,bH,true);
  const mid=await addBig(p2,p3);
  let r=await addBig(p1*10000,mid*100);r=await addBig(r,p4);return r;}
async function divBig(a,b){a=Math.round(a);b=Math.round(b);if(b===0)return 0;
  if(a<=99&&b<=99)return await flyBin("div",a,b);
  const ds=String(a).split("");let rem=0,q="";
  for(const ch of ds){rem=rem*10+(+ch);let qd=0;
    while(rem>=b&&qd<9){rem=await subBig(rem,b);qd++;}   // subtract b (fly) while it fits
    q+=qd;}
  return parseInt(q)||0;}
async function flyApply(name,a,b){const op=OPS[name];
  if(name==="add")return await addBig(a,b);
  if(name==="sub")return await subBig(a,b);
  if(name==="mul")return await mulBig(a,b);
  if(name==="div")return await divBig(a,b);
  return await flyUn(name,a);}

// ---------- the "checker": an ordinary calculator that verifies the fly ----------
// Ground-truth arithmetic done with BigInt so it is always exact (÷ is floor division,
// matching the fly's integer division). Toggled on/off; state remembered per viewer.
let CHK=false,lastCheck=null;
function bdiv(a,b){if(b===0n)return 0n;let q=a/b;if(a%b!==0n&&((a<0n)!==(b<0n)))q-=1n;return q;}
function trueExprVal(expr){try{const rpn=toRPN(tokenize(expr)),st=[];
  for(const k of rpn){if(k.t==="num"){st.push(BigInt(Math.round(k.v)));continue;}
    const b=st.pop(),a=st.pop();st.push(k.v==="+"?a+b:k.v==="-"?a-b:k.v==="*"?a*b:bdiv(a,b));}
  return st.length?st[st.length-1]:0n;}catch(e){return null;}}
const FNJS={square:a=>a*a,sqrt:a=>Math.sqrt(a),sin:a=>Math.sin(a*Math.PI/180),
  cos:a=>Math.cos(a*Math.PI/180),log:a=>Math.log10(a),inv:a=>1/a};
function roundDec(x,d){const p=Math.pow(10,d);return Math.round(x*p)/p;}
function showCheck(){const el=$("chkval");if(!CHK){el.textContent="off";return;}
  if(!lastCheck){el.textContent="on — waiting for a calculation";return;}
  const {trueStr,ok,flyStr}=lastCheck;
  el.innerHTML=ok?`= ${trueStr} <span class="ok">✓ correct</span>`
                 :`should be ${trueStr} <span class="bad">✗</span> <small>(fly said ${flyStr})</small>`;}
function checkExpr(problem,flyV){const t=trueExprVal(problem);if(t===null)return;
  const flyN=BigInt(Math.round(flyV)),ok=flyN===t;
  lastCheck={trueStr:t.toString(),ok,flyStr:String(Math.round(flyV))};showCheck();}
function checkUnary(name,problem,flyR){const op=OPS[name],ti=trueExprVal(problem);if(ti===null)return;
  const tv=roundDec(FNJS[name](Number(ti)),op.dec),flyN=+flyR,tol=Math.pow(10,-op.dec)/2+1e-9;
  const ok=isFinite(tv)&&Math.abs(tv-flyN)<=tol,ts=isFinite(tv)?(op.dec>0?tv.toFixed(op.dec):String(Math.round(tv))):"—";
  lastCheck={trueStr:ts,ok,flyStr:fmt(op,flyR)};showCheck();}

// evaluate an RPN stream, driving the fly for each operation (composed if big)
async function evalExpr(){
  const rpn=toRPN(tokenize(curExpr));const st=[];
  for(const k of rpn){
    if(k.t==="num"){st.push(k.v);continue;}
    const name=SYM2NAME[k.v],op=OPS[name];const b=st.pop(),a=st.pop();
    const big=(a>op.a[1]||b>op.b[1]);
    setDisp(curExpr,"…",accLine(name,big?null:Math.max(a,b))+(big?" · long "+({mul:"multiplication",div:"division",add:"addition",sub:"subtraction"}[name]):""));
    const v=await flyApply(name,a,b);
    st.push(v);setDisp(curExpr,String(Math.round(v)));$("step").innerHTML=`${a} ${op.sym} ${b} = <b>${Math.round(v)}</b>`;
  }
  return st.length?st[st.length-1]:0;}

async function evaluate(){if(busy)return;if(!curExpr.trim())return;busy=true;
  const problem=curExpr;   // snapshot before curExpr is overwritten with the result
  document.querySelectorAll(".movebtn").forEach(x=>x.classList.remove("on"));$("movestat").textContent="";
  const v=await evalExpr();busy=false;const shown=Number.isInteger(v)?v:(+v).toFixed(3);curExpr=String(Math.round(v));
  $("ans").textContent=shown;$("step").innerHTML=`answer <b>${shown}</b>`;checkExpr(problem,v);}
async function applyFn(name){if(busy)return;const op=OPS[name];if(!curExpr.trim())return;busy=true;
  const problem=curExpr;   // snapshot the inner expression for the checker
  const v=await evalExpr();const a=clampToOp(op,v);setDisp(`${op.sym}(${Math.round(v)})`,"…",accLine(name,v));
  const r=await flyUn(name,a);busy=false;curExpr=fmt(op,r);
  setDisp(`${op.sym}(${Math.round(v)})`,fmt(op,r),accLine(name));$("step").innerHTML=`answer <b>${fmt(op,r)}</b>`;checkUnary(name,problem,r);}
function doMove(c){if(busy)return;busy=true;document.querySelectorAll(".movebtn").forEach(x=>x.classList.toggle("on",+x.dataset.c===c));
  runAnim(dyn(drive([CMDS[c]])),null,'nerve cord: <b>motor neurons firing</b>',()=>{const f=feat(lastR(),MOTOR,STEPS-1);
    let bi=0,bv=-1e9;const o=mvec(B.movement.W_move,f);for(let i=0;i<o.length;i++)if(o[i]>bv){bv=o[i];bi=i;}
    busy=false;$("movestat").innerHTML=`motor output → <b>${B.movement.commands[bi]}</b> ✓`;$("step").innerHTML=`moved <b>${B.movement.commands[bi]}</b>`;});}
function press(s){if(busy)return;if(lastCheck){lastCheck=null;showCheck();}curExpr+=s;setDisp(curExpr);}

document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.d)));
document.querySelectorAll("[data-tok]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.tok)));
document.querySelectorAll("[data-fn]").forEach(b=>b.addEventListener("click",()=>applyFn(b.dataset.fn)));
document.querySelectorAll(".movebtn").forEach(b=>b.addEventListener("click",()=>doMove(+b.dataset.c)));
$("eq").addEventListener("click",evaluate);
$("clr").addEventListener("click",()=>{if(busy)return;curExpr="";setDisp("",0,"");$("step").textContent="ready";lastCheck=null;showCheck();});
addEventListener("keydown",e=>{if(e.key>="0"&&e.key<="9")press(e.key);else if("+-*/()".includes(e.key))press(e.key);
  else if(e.key==="Enter"||e.key==="=")evaluate();else if(e.key==="c"||e.key==="Escape")$("clr").click();
  else if(e.key==="Backspace"){if(!busy){curExpr=curExpr.slice(0,-1);setDisp(curExpr);}}});
addEventListener("resize",()=>{layout();staticDrawn=false;});
// effects on/off — default off if the viewer prefers reduced motion
const reduced=matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
FX=!reduced;$("fx").checked=FX;
$("fx").addEventListener("change",e=>{FX=e.target.checked;staticDrawn=false;});
// checker on/off — an ordinary calculator that verifies the fly; remembered per viewer
try{CHK=localStorage.getItem("mathfly_chk")==="1";}catch(e){}
$("chk").checked=CHK;showCheck();
$("chk").addEventListener("change",e=>{CHK=e.target.checked;try{localStorage.setItem("mathfly_chk",CHK?"1":"0");}catch(err){}showCheck();});
$("realtag").textContent=M.source.includes("real")?"REAL male-CNS connectome":M.source;
$("foot").innerHTML=`<span class="pill">${N.toLocaleString()} real neurons</span><span class="pill">${M.n_synapses.toLocaleString()} synapses</span>`+
  `<span class="pill">${M.movement_neurons} motor neurons</span><span class="pill">real anatomy</span><br>`+
  `<b>How it works:</b> the layout is the fly's real anatomy from soma coordinates — brain up top, ventral nerve cord below. Type an expression like <b>2 + 3 × 4</b>; a precedence parser breaks it into elementary steps and the fly computes each one, its neurons firing per step. The fly is exact at small operations (+ − to 999, × ÷ and functions to 99); for <b>bigger × and ÷</b> the calculator does long multiplication / division, with the fly doing every partial product, addition and subtraction — so big results compound the fly's per-step accuracy. Turn on the <b>✓ checker</b> to run an ordinary calculator alongside the fly and see, every time, whether the fly's answer is right. Movement fires the real motor neurons in the nerve cord.`;
layout();pickSparks();requestAnimationFrame(loop);   // brain is always alive (idle shimmer + firing)
curExpr="2+3×4";setDisp("2 + 3 × 4",0);setTimeout(evaluate,900);  // let the idle shimmer show first, then compute
</script>
